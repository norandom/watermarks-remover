[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "watermarks-hook"
version = "0.1.0"
description = "Pre-commit hook that strips AI provenance marks from text: Layer A Unicode carriers and Markdown/Quarto frontmatter"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
wm-hook = "wm_hook.cli:main"

# Dev-only. The shipped hook stays stdlib-only (steering/tech.md): a PEP 735
# group is not a distribution extra, so nothing here can reach an adopter's
# environment. `uv run` installs it by default.
[dependency-groups]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["wm_hook"]

# core/ is sys.path-imported by cli.py at runtime so its modules resolve by
# bare name, not as package modules, so they
# ship as package data.
[tool.setuptools.package-data]
wm_hook = ["core/*.py"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# src/ on the path so the suite tests the working tree rather than whatever
# happens to be installed, and so a test may import an owned module without
# going through the console-script entry point.
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
