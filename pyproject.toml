[build-system]
# >=77 for PEP 639: the SPDX `license = "MIT"` string. The old TOML-table form
# is deprecated with a 2027-02-18 removal date, and a first release should not
# ship on a build configuration with a known expiry.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "watermarks-hook"
# Pre-release on purpose. The cleaner has documented defects that damage
# Devanagari orthography and CJK typography (docs/reference/breakage.md); an
# adopter reading "0.1.0" on a release page should not have to find that out
# from the README.
version = "0.1.0a2"
description = "Pre-commit hook that detects and strips invisible Unicode carriers in text"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
wm-hook = "wm_hook.cli:main"

# Dev-only. The shipped hook stays stdlib-only (steering/tech.md): a PEP 735
# group is not a distribution extra, so nothing here can reach an adopter's
# environment. `uv run` installs it by default.
[dependency-groups]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = { "" = "src" }
# core/ is declared as a real package rather than shipped as package data.
# It is imported both ways -- cli.py puts the directory on sys.path so the
# modules resolve by bare name, while tests import wm_hook.core.flags -- and
# setuptools now warns that inferring a subpackage from package-data will stop
# being supported. Declaring it satisfies both import styles and the build.
packages = ["wm_hook", "wm_hook.core"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# src/ on the path so the suite tests the working tree rather than whatever
# happens to be installed, and so a test may import an owned module without
# going through the console-script entry point.
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
