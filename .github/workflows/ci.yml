name: CI

# Requirement 4 of .kiro/specs/ci-pipeline: every push and every pull request
# is verified. The steps themselves live in scripts/, not in this file, so the
# same pipeline runs here and on a workstation. A workflow that inlines its
# logic in YAML can only ever run on a runner, which is how CI and local
# verification drift apart.

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]   # tags are the release workflow's job
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Dagger
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh \
            | BIN_DIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Requirement 2: the write-path assertions that skip on Windows -- the
      # executable bit surviving a rewrite, and the symlink refusal -- only
      # actually run on a POSIX host. -ra makes a skip visible, because a skip
      # here means a platform gate is misfiring rather than passing.
      - name: Test suite on Linux
        run: bash scripts/test-linux.sh
