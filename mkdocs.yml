site_name: watermarks-remover
site_description: >-
  An experiment in measuring how much invisible AI provenance marking is
  actually present in real codebases, and removing it losslessly where it is.
site_url: https://norandom.github.io/watermarks-remover/
repo_url: https://github.com/norandom/watermarks-remover
repo_name: norandom/watermarks-remover
edit_uri: ""

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# Deliberately minimal. Every plugin that rewrites page content is a plugin
# that could introduce or destroy the exact characters this project studies.
plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  # Required by the "=== " install tabs in usage/quickstart.md and usage/detect.md.
  # Without it those blocks render as literal "=== " text, not as tabs.
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true

nav:
  - Home: index.md
  - Quickstart: usage/quickstart.md
  - Using it:
      - Detect carriers: usage/detect.md
      - The pre-commit hook: usage/hook.md
      - Sign your own text: usage/signing.md
      - Survey a tree: usage/survey.md
  - What we found:
      - Results: experiment/baseline.md
      - What it means: experiment/what-it-means.md
      - Method: experiment/method.md
  - Reference:
      - Invisible characters: reference/characters.md
      - What breaks: reference/breakage.md
      - Before and after: reference/examples.md
  - Limits and disclaimer: disclaimer.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/norandom/watermarks-remover

copyright: >-
  MIT licensed. Provided without warranty of any kind. Measurements are a
  dated snapshot, not a standing claim.
